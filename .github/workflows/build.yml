name: Build Server
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build Binary
        run: |
          go build -buildvcs=false -o owpengram-server ./cmd/telesrv
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: owpengram-server-binary
          path: owpengram-server
